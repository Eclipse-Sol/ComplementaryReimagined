#-----------------------------------------------------------------------------------------------------------------
# Hello! Welcome to the Complementary block library. Shaders use these IDs to perform block specific effects.
# If you want to add modded blocks, please feel free to put your block IDs in the following sections:
#
# block.10009 / block.10011: Leaves - duplicated due to waterlogged true/false
# block.10005: Base foliage material
# block.20007: Foliage; keeps material 10005 with WSR shapes enabled or disabled.
# block.10024: Modded Ores (shader will do its best to detect ore-pixels if "Enable Glowing Ores" setting is on)
# block.10028: Modded Light Sources / Emissives (shader will do its best to give a nice glow to the block)
# block.20000: No Parallax Occlusion Mapping
#
#
#
# ID Info:
# 5XXX - Block Entities
# 1XXXX - Terrain Materials / Shared WSR Shapes
# * 10000 - 11199 - Base terrain materials
# * Full blocks use base material entries. Non-full blocks should use their listed WSR shape section.
# * Terrain IDs that satisfy "ID % 2 == 1" are treated non-solid for colored lighting and world-space reflections
# * 11264 - 12287 - WSR Top Slabs / Stairs (base material +1264)
# * 12288 - 13311 - WSR Fences (base material +2288)
# * 13312 - 14335 - WSR Walls (base material +3312)
# * 14336 - 15359 - WSR Chorus Plants / Flowers (base material +4336)
# * 15360 - 16383 - WSR Layered Non-Full Blocks (base material +5360)
# * 16384 - 17407 - WSR Pressure Plates (base material +6384)
# * 17408 - 18431 - WSR Doors / Trapdoors (base material +7408)
# * 18432 - 19455 - WSR Buttons (base material +8432)
# 2XXXX - WSR Models / Captured Surfaces
# * 20002 - 21235 - WSR Captured Surfaces (base material +10002)
# 3XXXX - Translucent
# * 30XXX - General translucent materials
# * 31XXX - Translucents with advanced colored light tinting
# * 32XXX - Translucents with alternative shadow calculation
# 4XXXX - Items (see item.properties)
# * 44XXX - Items for colored handheld lighting
# * 45XXX - Items for other Iris exclusive features
# 5XXXX - Entities (see entity.properties)
#-----------------------------------------------------------------------------------------------------------------

